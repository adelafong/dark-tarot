<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090806"><title>Dark Tarot · 暗黑塔罗</title><link rel="stylesheet" href="style.css"></head><body><div class="top"><div><h1>DARK TAROT</h1><div class="sub">78 张完整塔罗 · 中文 / English 双语 · 手机直接占卜</div></div><div class="tabs"><button class="tab active" data-tab="read">占卜</button><button class="tab" data-tab="gallery">卡牌</button><button class="tab" data-tab="daily">每日一抽</button></div><div class="langs"><button class="lang active" data-lang="both">中英</button><button class="lang" data-lang="zh">中文</button><button class="lang" data-lang="en">EN</button></div></div>
<div class="wrap"><section id="read" class="panel"><div class="reading-grid"><aside><div class="box"><div class="form"><div><label>主题 Topic</label><select id="focus"><option value="general">综合 General</option><option value="love">感情 Love</option><option value="career">事业 Career</option><option value="study">学业 Study</option><option value="money">金钱 Money</option><option value="self">自我成长 Self</option></select></div><div class="two"><div><label>牌阵 Spread</label><select id="count"><option value="1">1 张</option><option value="3" selected>3 张</option><option value="5">5 张</option></select></div><div><label>牌组 Deck</label><select id="deck"><option value="full">78 张</option><option value="major">大牌</option><option value="minor">小牌</option></select></div></div><div><label>你的问题 Question</label><textarea id="question" placeholder="例如：我和他接下来三个月会怎样发展？"></textarea></div><div><label>背景 Context（可选）</label><textarea id="context" placeholder="例如：最近联系变少，我想知道关系方向。"></textarea></div><div class="two"><div><label>时间范围</label><input id="time" placeholder="例如：3个月"></div><div><label>涉及对象</label><input id="person" placeholder="例如：前任 / 上司"></div></div><label style="display:flex;align-items:center;gap:8px"><input id="reverse" type="checkbox" checked style="width:auto">启用逆位 Reversals</label><label style="display:flex;align-items:center;gap:8px"><input id="clarify" type="checkbox" style="width:auto">增加补充牌 Clarifier</label><button class="primary" id="draw">开始占卜 · Draw</button></div></div><div class="box"><div class="hint"><b>中文翻译已经加入。</b><br>每张牌都会同时显示：中文关键词、中文解释、英文原文，以及牌阵位置。</div></div></aside><main><div class="section-title"><div><h2>占卜结果</h2><div class="sub" id="meta">输入问题后开始抽牌。</div></div></div><div id="spread" class="spread"></div><div id="result" class="result"></div></main></div></section>
<section id="gallery" class="panel hidden" style="padding:18px"><div class="section-title"><h2>78 张卡牌</h2><div class="sub">点击卡牌可以下载网页 SVG 版本</div></div><div class="search"><input id="search" placeholder="搜索 The Moon / 月亮"><select id="filter"><option value="all">全部</option><option value="Major">Major</option><option value="Wands">Wands</option><option value="Cups">Cups</option><option value="Swords">Swords</option><option value="Pentacles">Pentacles</option></select></div><div id="grid" class="gallery"></div></section>
<section id="daily" class="panel hidden" style="padding:18px"><div class="section-title"><h2>每日一抽 · Daily Draw</h2><button class="primary" id="dailyBtn">抽今日牌</button></div><div id="dailyBox"></div></section></div><div class="footer">For entertainment & self-reflection · 娱乐与自我反思用途</div>
<script src="app.js"></script></body></html>
