<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090806">
  <title>Dark Tarot Ritual Reading</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">DARK TAROT</div>
        <h1>Ritual Reading</h1>
        <p class="sub">step by step • one question at a time • shuffle • draw • reveal</p>
      </div>
      <div class="top-actions">
        <div class="mode-tabs">
          <button id="readingModeBtn" class="mode-btn active">占卜</button>
          <button id="dailyModeBtn" class="mode-btn">每日一抽</button>
        </div>
        <button id="soundBtn" class="ghost small-btn">声音 ON</button>
        <button id="langBtn" class="ghost small-btn">中文 / EN</button>
        <button id="restartBtn" class="ghost small-btn">重新开始</button>
      </div>
    </header>

    <main id="readingMode" class="layout">
      <aside class="sidebar panel">
        <div class="progress-title">Reading Flow</div>
        <div id="progressList" class="progress-list"></div>
        <div class="ritual-note">
          <div class="ritual-label">Ritual</div>
          <p id="ritualText">先静下来，专注在你真正想问的问题上。</p>
        </div>
      </aside>

      <section class="main panel">
        <div id="wizard"></div>
      </section>
    </main>

    <section id="dailyMode" class="panel daily-panel hidden">
      <div id="dailyStage"></div>
    </section>

    <section id="galleryPanel" class="panel gallery-panel">
      <div class="gallery-head">
        <div>
          <div class="eyebrow">CARD LIBRARY</div>
          <h2>78 张卡牌</h2>
          <p class="sub">点击卡牌可下载单张图片</p>
        </div>
        <div class="gallery-tools">
          <input id="searchInput" type="text" placeholder="搜索 The Moon / 月亮">
          <select id="suitFilter">
            <option value="all">全部</option>
            <option value="Major">Major</option>
            <option value="Wands">Wands</option>
            <option value="Cups">Cups</option>
            <option value="Swords">Swords</option>
            <option value="Pentacles">Pentacles</option>
          </select>
        </div>
      </div>
      <div id="galleryGrid" class="gallery-grid"></div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
